services:
  # 1. Collector & Analytics Backend: Node.js Express + SQLite (WAL)
  backend:
    image: ${BACKEND_IMAGE:-varad177/slir-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_monitor_backend
    restart: unless-stopped
    # Bound to loopback; the frontend reaches it over the internal network.
    ports:
      - "${SLIR_GATEWAY_PORT:-4101}:4101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=4101
      - NODE_ENV=production
      - INGEST_API_KEY=${INGEST_API_KEY:-dev-secret-key}
      - DATABASE_PATH=/app/data/monitor.db
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4100,http://localhost:5173}
      - RETENTION_DAYS=${RETENTION_DAYS:-0}
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4101/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai_monitor_net

  # 2. Observability Dashboard: React 18 + Vite (Nginx Alpine)
  frontend:
    image: ${FRONTEND_IMAGE:-varad177/slir-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_monitor_frontend
    restart: unless-stopped
    # Bound to loopback; set to "0.0.0.0" to serve the dashboard to the LAN.
    ports:
      - "${SLIR_DASHBOARD_PORT:-4100}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai_monitor_net

volumes:
  sqlite_data:
    name: ai_monitor_sqlite_data

networks:
  ai_monitor_net:
    name: ai_monitor_net
    driver: bridge
