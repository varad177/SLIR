services:
  app:
    image: ${SLIR_IMAGE:-slir-app:latest}
    container_name: ai_monitor_app
    restart: unless-stopped
    # Both host ports reach the same listener: 4100 for the dashboard, 4101 for the API.
    ports:
      - "${SLIR_DASHBOARD_PORT:-4100}:4101"
      - "${SLIR_GATEWAY_PORT:-4101}:4101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=4101
      - NODE_ENV=production
      - INGEST_API_KEY=${INGEST_API_KEY:-dev-secret-key}
      - DATABASE_PATH=/app/data/monitor.db
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4100,http://localhost:5173}
      - RETENTION_DAYS=${RETENTION_DAYS:-0}
      - SLIR_PUBLIC_BASE_URL=${SLIR_PUBLIC_BASE_URL:-}
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4101/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sqlite_data:
    name: ai_monitor_sqlite_data
